                const fetchWeather = async () => {
                    setLoading(true);
                    try {
                        // Fetch current weather forecast (hourly)
                        const response = await fetch(
                            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,weathercode&timezone=auto&forecast_days=1`
                        );
                        const data = await response.json();
                        
                        if (data.hourly) {
                            const currentHour = new Date().getHours();
                            // Map API data to our format
                            const hours = data.hourly.time.map((t, i) => {
                                const date = new Date(t);
                                const hour = date.getHours();
                                const code = data.hourly.weathercode[i];
                                
                                let icon = "sun";
                                if (code >= 51 && code <= 67) icon = "cloudRain"; // Rain
                                else if (code >= 95) icon = "cloudRain"; // Storm
                                else if (code >= 1 && code <= 3) icon = "cloudSun"; // Cloudy
                                else if (hour < 6 || hour > 19) icon = "moon";

                                return {
                                    time: `${hour}:00`,
                                    temp: `${Math.round(data.hourly.temperature_2m[i])}°`,
                                    icon: icon
                                };
                            }).filter((_, i) => {
                                // Simple filter to show e.g. next 24h or just significant hours
                                // Here we just take every 2nd hour to save space or take all
                                return true; 
                            });
                            setWeather(hours);
                        }
                    } catch (e) {
                        console.error("Weather fetch failed", e);
                    } finally {
                        setLoading(false);
                    }
                };

                fetchWeather();
            }, [lat, lon]);
